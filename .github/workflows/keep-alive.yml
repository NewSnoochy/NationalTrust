name: Keep alive

# Supabase pauses a free project after ~7 days with no requests. This makes one
# real database read every 3 days so the project stays active, with plenty of
# margin if a run is skipped. Runs on a schedule, or on demand from the
# Actions tab. (GitHub also disables scheduled workflows in a repo after 60
# days without a commit; the monthly "Update places" workflow commits
# UPDATES.log, which keeps this schedule enabled too.)
on:
  schedule:
    - cron: "23 6 */3 * *"   # every 3 days, 06:23 UTC
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: https://qkhlfegiwezkplvmgwji.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/places?select=id&limit=1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" > /dev/null
          echo "Pinged Supabase; project activity refreshed."

      # Reports whether the project is active, via the Supabase Management API.
      # Needs a personal access token (https://supabase.com/dashboard/account/tokens)
      # stored as the repo secret SUPABASE_ACCESS_TOKEN. Without it this step
      # just prints a note and the keep-alive above still does its job.
      - name: Report project status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: qkhlfegiwezkplvmgwji
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::keep-alive: SUPABASE_ACCESS_TOKEN not set — status check skipped."
            echo "To enable it: create a token at https://supabase.com/dashboard/account/tokens"
            echo "and add it under Settings > Secrets and variables > Actions as SUPABASE_ACCESS_TOKEN."
            exit 0
          fi
          status=$(curl -fsS "https://api.supabase.com/v1/projects" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r --arg ref "$PROJECT_REF" '.[] | select(.id==$ref) | .status')
          if [ -z "$status" ]; then
            echo "::warning::keep-alive: project $PROJECT_REF not found for this token (check the token's organization)."
            exit 0
          fi
          echo "Project status: $status"
          echo "**Supabase project status:** \`$status\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = "ACTIVE_HEALTHY" ]; then
            echo "::notice::keep-alive: Supabase project status is $status."
          else
            echo "::warning::keep-alive: Supabase project status is $status (not ACTIVE_HEALTHY) — check the dashboard."
          fi

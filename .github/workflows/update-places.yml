name: Update places

# Rebuilds the National Trust / NT for Scotland place list from Wikidata,
# Wikipedia and OpenStreetMap and loads it into Supabase. Runs on the 1st of
# every month, or on demand: Actions tab > Update places > Run workflow.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write        # to append to UPDATES.log (see the last step)

concurrency:
  group: update-places
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and load places
        env:
          SUPABASE_URL: https://qkhlfegiwezkplvmgwji.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python tools/sync_supabase.py
      # GitHub switches off scheduled workflows in a public repo after 60 days
      # without a commit. Logging each run keeps this one alive. Only counts are
      # written: the place list itself stays private in Supabase.
      - name: Log the run
        run: |
          echo "$(date -u +%Y-%m-%d) $(cat build/last_update.txt)" >> UPDATES.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPDATES.log
          git commit -m "Place list updated: $(cat build/last_update.txt)"
          git push
